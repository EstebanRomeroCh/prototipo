<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ÁBACO DIOCESANO</title>
  <link rel="stylesheet" href="/static/css/general.css">
  <link rel="shortcut icon" href="/static/images/favicon.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>


  <style>
    /* Botones juntos */
    button {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <button id="btnToggleSidebar" class="btn-toggle-sidebar" type="button" aria-label="Abrir menú">
      ☰
    </button>
    <img src="/static/images/imagen.png" alt="logo de abaco">
    <h5 class="mb-0"> <strong>DIOCESANO</strong></h5>
    <div>
      <!-- Dropdown usuario -->
      <div class="dropdown">
        <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" id="menuUsuario"
          role="button" data-bs-toggle="dropdown" aria-expanded="false" style="color: inherit;">

          <i class="bi bi-person-circle me-2"></i>
          <strong>{{usuario}}</strong>
        </a>

        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="menuUsuario">
          <li>
            <a class="dropdown-item" href="{{url_for('rutas_dp.manual_usuario')}}" target="_blank">
              <i class="bi bi-journal-text me-2"></i> Manual de usuario
            </a>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li>
            <a class="dropdown-item text-danger" style="cursor: pointer;" onclick="cerrar()">
              <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
            </a>
          </li>
        </ul>
      </div> <span class="noti-wrapper me-3 position-relative">
        <i class="bi bi-bell-fill" id="iconoNotificaciones" style="cursor:pointer;"
          onclick="mostrarNotificaciones()"></i>
        <span id="badgeNotificaciones" class="badge-notify d-none">0</span>
      </span>

    </div>

  </header>

  <!-- LAYOUT: SIDEBAR + CONTENT -->
  <div class="main-layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <a href="{{ url_for('rutas_dp.menu_central') }}"><i class="bi bi-house-door-fill"></i><span>Inicio</span></a>
      <a href="{{ url_for('rutas_dp.menu_de_parroquias') }}"><i class="bi bi-bank"></i><span>Organizaciones</span></a>
      <a href="{{ url_for('rutas_dp.menu_producto') }}"><i class="bi bi-bookmark-plus"></i><span>Productos</span></a>
      <a href="{{ url_for('rutas_dp.menu_donante') }}"><i class="bi bi-people-fill"></i><span>Donantes</span></a>
      <a href="{{ url_for('rutas_dp.pagina_principal') }}"><i class="bi bi-heart-fill"></i><span>Entradas</span></a>
      <a href="{{ url_for('rutas_dp.lista_donaciones') }}"><i class="bi bi-bag-check"></i><span>Lista de
          Entradas</span></a>
      <a href="{{ url_for('rutas_dp.tabla_producto') }}"><i class="bi bi-table"></i><span>Inventario</span></a>
      <a href="{{ url_for('rutas_dp.movimiento_inv') }}"><i class="bi bi-box-arrow-right"></i><span>Salidas</span></a>
      <a href="{{ url_for('rutas_dp.lista_salidas') }}"><i class="bi bi-card-checklist"></i><span> Lista de
          Salidas</span></a>
      <a href="{{ url_for('rutas_dp.menu_gastos') }}"><i class="bi bi-box-seam"></i><span>Reportes de Salidas</span></a>
      <a href="{{ url_for('rutas_dp.menu_reportes') }}"><i class="bi bi-graph-up"></i><span>Reportes y
          Certificados</span></a>
      <a href="{{ url_for('rutas_dp.pag_confi') }}"><i class="bi bi-gear-fill"></i><span>Configuración</span></a>
      <a class="mt-auto" style="cursor: row-resize;" onclick="cerrar()"><i class="bi bi-box-arrow-left"></i><span>Cerrar
          sesión</span></a>
    </div>


    <!-- CONTENIDO -->
    <div class="container my-4">

      <div class="container bg-white p-4 rounded shadow">

        <form id="formConfiguracion">
          <!-- 🔹 Botón de regresar en la esquina del formulario -->
          <a href="{{ url_for('rutas_dp.pag_confi') }}" class="btn btn-outline-success btn-sm position-absolute">
            <i class="bi bi-arrow-left"></i>
          </a>
          <h1>Configuración del Sistema</h1>
          <label for="nombreBanco">Nombre del Banco de Alimentos</label>
          <input type="text" id="nombreBanco" placeholder="Ej: Banco de Alimentos San José" required>

          <label for="correoContacto">Correo de contacto</label>
          <input type="email" id="correoContacto" placeholder="contacto@ejemplo.com">

          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" placeholder="Ej: 3001234567">

          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" placeholder="Calle 123 #45-67, Ciudad">

          <label for="diasAlerta">Días de alerta antes del vencimiento</label>
          <input type="number" id="diasAlerta" min="1" value="7">

          <button class="mx-auto" type="submit">Guardar Configuración</button>
        </form>
      </div>
    </div>
    <img src="/static/images/favicon.png" alt="header icon" style="
        width: 30px;
        height: 30px;
        position: fixed;
        bottom: 10px;
        right: 10px;
z-index: 999;">
    <script>

      const form = document.getElementById('formConfiguracion');

      // Guardar configuración
      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const config = {
          nombreBanco: document.getElementById('nombreBanco').value,
          correo: document.getElementById('correoContacto').value,
          telefono: document.getElementById('telefono').value,
          direccion: document.getElementById('direccion').value,
          diasAlerta: document.getElementById('diasAlerta').value,
          formatoFecha: document.getElementById('formatoFecha').value
        };

        localStorage.setItem('configSistema', JSON.stringify(config));
        alert("✅ Configuración guardada correctamente.");
      });

      // Cargar configuración si ya existe
      window.addEventListener('load', () => {
        const config = JSON.parse(localStorage.getItem('configSistema'));
        if (config) {
          document.getElementById('nombreBanco').value = config.nombreBanco || '';
          document.getElementById('correoContacto').value = config.correo || '';
          document.getElementById('telefono').value = config.telefono || '';
          document.getElementById('direccion').value = config.direccion || '';
          document.getElementById('diasAlerta').value = config.diasAlerta || 7;
          document.getElementById('formatoFecha').value = config.formatoFecha || 'dd/mm/yyyy';
        }
      });
    </script>
    <script src="/static/js/resaltar.js"></script>
    <script src="/static/js/notificacion.js"></script>
    <script src="/static/js/time.js"></script>

    <script>
      resaltar()

    </script>

</body>

</html>
