<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ÁBACO DIOCESANO</title>
    <link rel="stylesheet" href="/static/css/general.css">
    <link rel="stylesheet" href="/static/css/parametros.css">
    <link rel="shortcut icon" href="/static/images/favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>



</head>

<body>

    <!-- HEADER -->
    <header>
    <button id="btnToggleSidebar" class="btn-toggle-sidebar" type="button" aria-label="Abrir menú">
      ☰
    </button>
    <img src="/static/images/imagen.png" alt="logo de abaco">
    <h5 class="mb-0"> <strong>DIOCESANO</strong></h5>
    <div>
      <!-- Dropdown usuario -->
      <div class="dropdown">
        <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" id="menuUsuario"
          role="button" data-bs-toggle="dropdown" aria-expanded="false" style="color: inherit;">

          <i class="bi bi-person-circle me-2"></i>
          <strong>{{usuario}}</strong>
        </a>

        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="menuUsuario">
          <li>
            <a class="dropdown-item" href="{{url_for('rutas_dp.manual_usuario')}}" target="_blank">
              <i class="bi bi-journal-text me-2"></i> Manual de usuario
            </a>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li>
            <a class="dropdown-item text-danger" style="cursor: pointer;" onclick="cerrar()">
              <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
            </a>
          </li>
        </ul>
      </div> <span class="noti-wrapper me-3 position-relative">
        <i class="bi bi-bell-fill" id="iconoNotificaciones" style="cursor:pointer;"
          onclick="mostrarNotificaciones()"></i>
        <span id="badgeNotificaciones" class="badge-notify d-none">0</span>
      </span>

    </div>

  </header>

    <!-- LAYOUT -->
    <div class="main-layout">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <a href="{{ url_for('rutas_dp.menu_central') }}"><i
                    class="bi bi-house-door-fill"></i><span>Inicio</span></a>
            <a href="{{ url_for('rutas_dp.menu_de_parroquias') }}"><i
                    class="bi bi-bank"></i><span>Organizaciones</span></a>
            <a href="{{ url_for('rutas_dp.menu_producto') }}"><i
                    class="bi bi-bookmark-plus"></i><span>Productos</span></a>
            <a href="{{ url_for('rutas_dp.menu_donante') }}"><i class="bi bi-people-fill"></i><span>Donantes</span></a>
            <a href="{{ url_for('rutas_dp.pagina_principal') }}"><i
                    class="bi bi-heart-fill"></i><span>Entradas</span></a>
            <a href="{{ url_for('rutas_dp.lista_donaciones') }}"><i class="bi bi-bag-check"></i><span>Lista de
                    Entradas</span></a>
            <a href="{{ url_for('rutas_dp.tabla_producto') }}"><i class="bi bi-table"></i><span>Inventario</span></a>
            <a href="{{ url_for('rutas_dp.movimiento_inv') }}"><i
                    class="bi bi-box-arrow-right"></i><span>Salidas</span></a>
            <a href="{{ url_for('rutas_dp.lista_salidas') }}"><i class="bi bi-card-checklist"></i><span> Lista de
                    Salidas</span></a>
            <a href="{{ url_for('rutas_dp.menu_gastos') }}"><i class="bi bi-box-seam"></i><span>Reportes de
                    Salidas</span></a>
            <a href="{{ url_for('rutas_dp.menu_reportes') }}"><i class="bi bi-graph-up"></i><span>Reportes y
                    Certificados</span></a>
            <a href="{{ url_for('rutas_dp.pag_confi') }}"><i class="bi bi-gear-fill"></i><span>Configuración</span></a>
            <a class="mt-auto" style="cursor: row-resize;" onclick="cerrar()"><i
                    class="bi bi-box-arrow-left"></i><span>Cerrar
                    sesión</span></a>
        </div>


        <!-- CONTENIDO PRINCIPAL -->
        <div class="container my-4">

            <div class="container bg-white p-4 rounded shadow">
                <div class="dashboard" id="managementDashboard">
                    <div class="dashboard-header">
                        <!-- 🔹 Botón de regresar en la esquina del formulario -->
                        <a href="{{ url_for('rutas_dp.pag_confi') }}" class="btn btn-outline-success btn-sm ">
                            <i class="bi bi-arrow-left"></i>
                        </a>
                        <h2>Gestión de Documentos</h2>
                        <div class="controls">
                            <div class="top-controls">
                                <input id="searchInput" class="search-input"
                                    placeholder="Buscar por nombre o código...">
                                <button id="openAdd" class="add-param-btn"><i class="fas fa-plus"></i> Agregar
                                    parámetro</button>
                            </div>
                        </div>
                    </div>
                    <div class="param-type-selector" id="typeSelector">
                        <button class="param-type-btn" data-type="document">Tipo Documento</button>
                        <!--button class="param-type-btn" data-type="status">Tipo de Movimiento</-buttoN-->
                        <!--button class="param-type-btn" data-type="status">Tipo de Reporte</-button-->
                        <!--button class="param-type-btn active" data-type="all">acciones Tomadas</-button-->
                    </div>
                    <div id="paramsContainer" class="params-grid" aria-live="polite"></div>
                </div>
            </div>

            <!-- Modal -->
            <div class="modal" id="modal">
                <div class="modal-card">
                    <div class="modal-header">
                        <h3 id="modalTitle">Agregar parámetro</h3>
                        <button class="close-btn" id="closeModalBtn">&times;</button>
                    </div>
                    <form id="parameterForm">
                        <div class="form-group">
                            <label for="paramType">Tipo de parámetro</label>
                            <select id="paramType" required>
                                <option value="" disabled selected>Seleccione un tipo...</option>
                                <option value="document">Tipo Documento</option>
                                <!--option value="gender">Tipo de Estado</!--option>
                                <option value="status">Tipo de Movimiento</option>
                                <option value="status">Tipo de Reporte</option>
                                <option-- value="status">Acciones Tomadas</option-->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="name">Nombre</label>
                            <input id="name" required />
                        </div>
                        <div class="form-group">
                            <label for="description">Descripción</label>
                            <textarea id="description" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="statusSelect">Estado</label>
                            <select id="statusSelect">
                                <option value="active">Activo</option>
                                <option value="inactive">Inactivo</option>
                            </select>
                        </div>
                        <input type="hidden" id="editOldType">
                        <input type="hidden" id="editOldCode">
                        <button class="submit-btn" type="submit">Guardar</button>
                    </form>
                </div>
            </div>

            <div id="notification" class="notification"></div>

        </div>
    </div>
    <img src="/static/images/favicon.png" alt="header icon" style="
        width: 30px;
        height: 30px;
        position: fixed;
        bottom: 10px;
        right: 10px;
z-index: 999;">
    <!-- JS parametrización -->

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/parametros.js"></script>
    <script src="/static/js/tipo_documento.js"></script>
    <script src="/static/js/resaltar.js"></script>
    <script src="/static/js/notificacion.js"></script>
    <script src="/static/js/time.js"></script>
</body>

</html>
