<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ÁBACO DIOCESANO</title>
    <link rel="stylesheet" href="/static/css/general.css">
    <link rel="stylesheet" href="/static/css/permisos_asistentes.css">
    <link rel="shortcut icon" href="/static/images/favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

    <!-- HEADER -->
    <header>
    <button id="btnToggleSidebar" class="btn-toggle-sidebar" type="button" aria-label="Abrir menú">
      ☰
    </button>
    <img src="/static/images/imagen.png" alt="logo de abaco">
    <h5 class="mb-0"> <strong>DIOCESANO</strong></h5>
    <div>
      <!-- Dropdown usuario -->
      <div class="dropdown">
        <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" id="menuUsuario"
          role="button" data-bs-toggle="dropdown" aria-expanded="false" style="color: inherit;">

          <i class="bi bi-person-circle me-2"></i>
          <strong>{{usuario}}</strong>
        </a>

        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="menuUsuario">
          <li>
            <a class="dropdown-item" href="{{url_for('rutas_dp.manual_usuario')}}" target="_blank">
              <i class="bi bi-journal-text me-2"></i> Manual de usuario
            </a>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li>
            <a class="dropdown-item text-danger" style="cursor: pointer;" onclick="cerrar()">
              <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
            </a>
          </li>
        </ul>
      </div> <span class="noti-wrapper me-3 position-relative">
        <i class="bi bi-bell-fill" id="iconoNotificaciones" style="cursor:pointer;"
          onclick="mostrarNotificaciones()"></i>
        <span id="badgeNotificaciones" class="badge-notify d-none">0</span>
      </span>

    </div>

  </header>

    <!-- LAYOUT: SIDEBAR + CONTENT -->
    <div class="main-layout">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <a href="{{ url_for('rutas_dp.menu_central') }}"><i
                    class="bi bi-house-door-fill"></i><span>Inicio</span></a>
            <a href="{{ url_for('rutas_dp.menu_de_parroquias') }}"><i
                    class="bi bi-bank"></i><span>Organizaciones</span></a>
            <a href="{{ url_for('rutas_dp.menu_producto') }}"><i
                    class="bi bi-bookmark-plus"></i><span>Productos</span></a>
            <a href="{{ url_for('rutas_dp.menu_donante') }}"><i class="bi bi-people-fill"></i><span>Donantes</span></a>
            <a href="{{ url_for('rutas_dp.pagina_principal') }}"><i
                    class="bi bi-heart-fill"></i><span>Entradas</span></a>
            <a href="{{ url_for('rutas_dp.lista_donaciones') }}"><i class="bi bi-bag-check"></i><span>Lista de
                    Entradas</span></a>
            <a href="{{ url_for('rutas_dp.tabla_producto') }}"><i class="bi bi-table"></i><span>Inventario</span></a>
            <a href="{{ url_for('rutas_dp.movimiento_inv') }}"><i
                    class="bi bi-box-arrow-right"></i><span>Salidas</span></a>
            <a href="{{ url_for('rutas_dp.lista_salidas') }}"><i class="bi bi-card-checklist"></i><span> Lista de
                    Salidas</span></a>
            <a href="{{ url_for('rutas_dp.menu_gastos') }}"><i class="bi bi-box-seam"></i><span>Reportes de
                    Salidas</span></a>
            <a href="{{ url_for('rutas_dp.menu_reportes') }}"><i class="bi bi-graph-up"></i><span>Reportes y
                    Certificados</span></a>
            <a href="{{ url_for('rutas_dp.pag_confi') }}"><i class="bi bi-gear-fill"></i><span>Configuración</span></a>
            <a class="mt-auto" style="cursor: row-resize;" onclick="cerrar()"><i
                    class="bi bi-box-arrow-left"></i><span>Cerrar
                    sesión</span></a>
        </div>


        <!-- CONTENIDO -->
        <div class="container my-4">
            <div class="container bg-white p-4 rounded shadow">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-10">
                        <!-- 🔹 Botón de regresar en la esquina del formulario -->
                        <a href="{{ url_for('rutas_dp.pag_confi') }}"
                            class="btn btn-outline-success btn-sm position-absolute">
                            <i class="bi bi-arrow-left"></i>
                        </a>
                        <h2 class="mb-4 text-center"> Gestión de Usuarios</h2>

                        <div class="accordion" id="accordionUsuarios">
                            <!-- Usuarios Registrados -->
                            <div class="accordion-item">
                                <h2 class="accordion-header" id="headingOne">
                                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                        data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                                        Usuarios Registrados
                                    </button>
                                </h2>
                                <div id="collapseOne" class="accordion-collapse collapse show"
                                    aria-labelledby="headingOne" data-bs-parent="#accordionUsuarios">
                                    <div class="accordion-body">
                                        <div id="listaUsuarios" class="row g-4"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Registrar Usuario -->
                            <div class="accordion-item">
                                <h2 class="accordion-header" id="headingTwo">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                        data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                                        Registrar Usuario
                                    </button>
                                </h2>
                                <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo"
                                    data-bs-parent="#accordionUsuarios">
                                    <div class="accordion-body">
                                        <form id="formUsuario">
                                            <div class="mb-3">
                                                <label for="nombreUsuario" class="form-label">Nombre completo</label>
                                                <input type="text" id="nombreUsuario" class="form-control" required>
                                            </div>

                                            <div class="mb-3">
                                                <label for="telefono" class="form-label">Numero Celular</label>
                                                <input type="number" id="telefono" class="form-control" required>
                                            </div>

                                            <div class="mb-3">
                                                <label for="correo" class="form-label">Correo electrónico</label>
                                                <input type="email" id="correo" class="form-control">
                                            </div>

                                            <div class="mb-3">
                                                <label for="password" class="form-label">Contraseña</label>
                                                <input type="password" id="password" class="form-control" required>
                                            </div>

                                            <div class="mb-3">
                                                <label for="confirmPassword" class="form-label">Confirmar
                                                    Contraseña</label>
                                                <input type="password" id="confirmPassword" class="form-control"
                                                    required>
                                            </div>

                                            <div class="mb-3">
                                                <label for="rol" class="form-label">Rol de usuario</label>
                                                <select id="rol" class="form-select">
                                                </select>
                                            </div>

                                            <div class="d-flex justify-content-between">
                                                <button type="submit" class="btn btn-success btn-custom">Guardar
                                                    Usuario</button>
                                                <button type="reset"
                                                    class="btn btn-secondary btn-custom">Limpiar</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal Editar Usuario -->
        <!-- Modal Editar Usuario -->
        <div class="modal fade" id="modalEditarUsuario" tabindex="-1" aria-labelledby="modalEditarUsuarioLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <form id="formEditarUsuario">
                    <div class="modal-content">
                        <div class="modal-header bg-success">
                            <h5 class="modal-title">Editar Usuario</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="editarIdUsuario">

                            <div class="mb-3">
                                <label for="editarNombreUsuario" class="form-label">Nombre completo</label>
                                <input type="text" id="editarNombreUsuario" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="editarTelefono" class="form-label">Teléfono</label>
                                <input type="text" id="editarTelefono" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="editarCorreo" class="form-label">Correo electrónico</label>
                                <input type="email" id="editarCorreo" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="editarPassword" class="form-label">Contraseña (opcional)</label>
                                <input type="password" id="editarPassword" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="editarConfirmPassword" class="form-label">Confirmar Contraseña</label>
                                <input type="password" id="editarConfirmPassword" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="editarRol" class="form-label">Rol</label>
                                <select id="editarRol" class="form-select"></select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-success">Actualizar Usuario</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <img src="/static/images/favicon.png" alt="header icon" style="
        width: 30px;
        height: 30px;
        position: fixed;
        bottom: 10px;
        right: 10px;
z-index: 999;">
        <!-- Scripts -->

        <script>
            resaltar()
        </script>
        <script src="/static/js/usuarios.js"></script>
        <!-- Bootstrap JS (requerido para el acordeón) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/static/js/time.js"></script>

        <script src="/static/js/resaltar.js"></script>
        <script src="/static/js/notificacion.js"></script>

</body>

</html>
